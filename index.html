<!doctype html>
<html lang="es" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('serene-theme');
          if (theme !== 'forest' && theme !== 'blue' && theme !== 'night') {
            theme = 'forest';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === 'night' ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'forest';
        }
      })();
    </script>
    <!-- Favicon del navegador -->
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Configuración iOS / Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Serene" />

    <!-- Metadatos PWA -->
    <meta name="theme-color" content="#F8F9FA" />

    <title>Serene Finance</title>
  </head>
  <body class="bg-canvas text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
